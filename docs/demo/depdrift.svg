<svg xmlns="http://www.w3.org/2000/svg" width="980" height="710" viewBox="0 0 980 710" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#11161d"/><stop offset="1" stop-color="#0b0f14"/></linearGradient></defs>
<rect width="980" height="710" rx="12" fill="url(#bg)"/>
<rect width="980" height="42" rx="12" fill="#161d26"/>
<rect y="30" width="980" height="12" fill="#161d26"/>
<circle cx="22" cy="21" r="6" fill="#ff5f57"/><circle cx="44" cy="21" r="6" fill="#febc2e"/><circle cx="66" cy="21" r="6" fill="#28c840"/>
<text x="490.0" y="26" fill="#7d8794" font-size="12" text-anchor="middle">depdrift · lockfile diff review</text>
<text x="24" y="64" fill="#4fd18b" font-size="13">$ depdrift review package-lock.json.old package-lock.json</text>
<text x="24" y="88" fill="#d7dde5" font-size="13" xml:space="preserve"># Dependency review</text>
<text x="24" y="108" fill="#d7dde5" font-size="13" xml:space="preserve"></text>
<text x="24" y="128" fill="#d7dde5" font-size="13" xml:space="preserve">- before: `tests/fixtures/old-package-lock.json`</text>
<text x="24" y="148" fill="#d7dde5" font-size="13" xml:space="preserve">- after:  `tests/fixtures/new-package-lock.json`</text>
<text x="24" y="168" fill="#d7dde5" font-size="13" xml:space="preserve">- added 3, removed 0, changed 1</text>
<text x="24" y="188" fill="#ff6b6b" font-size="13" xml:space="preserve">- worst finding: **critical**</text>
<text x="24" y="208" fill="#d7dde5" font-size="13" xml:space="preserve"></text>
<text x="24" y="228" fill="#d7dde5" font-size="13" xml:space="preserve">## Findings</text>
<text x="24" y="248" fill="#d7dde5" font-size="13" xml:space="preserve"></text>
<text x="24" y="268" fill="#d7dde5" font-size="13" xml:space="preserve">| severity | package | version | rule | detail |</text>
<text x="24" y="288" fill="#d7dde5" font-size="13" xml:space="preserve">|---|---|---|---|---|</text>
<text x="24" y="308" fill="#ff6b6b" font-size="13" xml:space="preserve">| critical | expresss | 1.0.3 | typosquat | name is within edit distance of popular package &#x27;express&#x27; |</text>
<text x="24" y="328" fill="#ffa94d" font-size="13" xml:space="preserve">| high | expresss | 1.0.3 | install-script | package declares an install/postinstall script that runs on</text>
<text x="24" y="348" fill="#d7dde5" font-size="13" xml:space="preserve">   npm install |</text>
<text x="24" y="368" fill="#ffa94d" font-size="13" xml:space="preserve">| high | shady-pkg | 0.0.1 | git-dependency | resolves to a git reference instead of a published</text>
<text x="24" y="388" fill="#d7dde5" font-size="13" xml:space="preserve">   tarball; no immutability guarantee |</text>
<text x="24" y="408" fill="#ffd43b" font-size="13" xml:space="preserve">| medium | express | 5.0.0 | major-version-jump | 4.18.2 -&gt; 5.0.0: major version changed, read the</text>
<text x="24" y="428" fill="#d7dde5" font-size="13" xml:space="preserve">   changelog |</text>
<text x="24" y="448" fill="#ffd43b" font-size="13" xml:space="preserve">| medium | mirrored-pkg | 2.1.0 | non-default-registry | resolves from &#x27;registry.evil-mirror.dev&#x27;</text>
<text x="24" y="468" fill="#d7dde5" font-size="13" xml:space="preserve">   instead of registry.npmjs.org |</text>
<text x="24" y="488" fill="#d7dde5" font-size="13" xml:space="preserve"></text>
<text x="24" y="508" fill="#d7dde5" font-size="13" xml:space="preserve">## Added</text>
<text x="24" y="528" fill="#d7dde5" font-size="13" xml:space="preserve"></text>
<text x="24" y="548" fill="#d7dde5" font-size="13" xml:space="preserve">- `expresss@1.0.3`</text>
<text x="24" y="568" fill="#d7dde5" font-size="13" xml:space="preserve">- `mirrored-pkg@2.1.0`</text>
<text x="24" y="588" fill="#d7dde5" font-size="13" xml:space="preserve">- `shady-pkg@0.0.1`</text>
<text x="24" y="608" fill="#d7dde5" font-size="13" xml:space="preserve"></text>
<text x="24" y="628" fill="#d7dde5" font-size="13" xml:space="preserve">## Changed</text>
<text x="24" y="648" fill="#d7dde5" font-size="13" xml:space="preserve"></text>
<text x="24" y="668" fill="#d7dde5" font-size="13" xml:space="preserve">- `express` 4.18.2 -&gt; 5.0.0</text>
<text x="24" y="688" fill="#d7dde5" font-size="13" xml:space="preserve"></text>
</svg>