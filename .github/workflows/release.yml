name: release

# Publishes to PyPI via trusted publishing (OIDC): no API token is stored here.
# One-time setup by the maintainer, per project at pypi.org/manage/account/publishing:
#   PyPI Project Name: depdrift
#   Owner: mgkvibez
#   Repository name: depdrift
#   Workflow name: release.yml
#   Environment name: pypi
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refuse to publish if the tag and the package version disagree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$tag version=$version"
          [ "$tag" = "$version" ] || { echo "tag v$tag does not match version $version"; exit 1; }
      - name: Build and validate
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
