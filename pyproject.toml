[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "depdrift"
version = "0.1.1"
description = "Review what actually changed between two lockfiles, and what is risky about it."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mgkvibez" }]
keywords = ["supply-chain", "lockfile", "npm", "security", "dependencies", "developer-tools"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
depdrift = "depdrift.cli:main"

[tool.setuptools]
packages = ["depdrift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
